<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Germán Rojas La Valle — Content & Social Media Manager</title>
<meta name="description" content="Content & Social Media Manager with 4+ years leading content strategy across LATAM's fintech industry. Case studies, creator work, and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="site-header" id="top">
  <div class="wrap header-inner">
    <a href="#top" class="logo">Germán Rojas La Valle</a>
    <nav class="main-nav" id="main-nav">
      <!-- se completa a medida que armamos cada sección -->
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language"></button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="intro">
    <div class="wrap intro-grid">
      <div class="intro-photo-wrap">
        <span class="intro-photo-panel" aria-hidden="true"></span>
        <div class="intro-photo">
          <img src="assets/images/profile.jpg" alt="Germán Rojas La Valle">
        </div>
      </div>
      <div class="intro-content">
        <p class="role-line" id="intro-status"></p>
        <h1 id="intro-title"></h1>
        <p class="intro-subtitle" id="intro-subtitle"></p>
        <div class="intro-ctas">
          <a href="#work" class="btn btn-primary" id="intro-cta-work"></a>
          <a href="#contact" class="btn btn-ghost" id="intro-cta-contact"></a>
        </div>
      </div>
    </div>
  </section>

  <section class="details" id="details">
    <div class="wrap details-grid">
      <div class="details-col">
        <h2 class="details-heading" id="details-experience-heading"></h2>
        <ul class="timeline" id="details-experience"></ul>
      </div>
      <div class="details-col">
        <h2 class="details-heading" id="details-education-heading"></h2>
        <ul class="timeline" id="details-education"></ul>
        <a href="assets/files/German_Rojas_La_Valle_CV_ES.pdf" class="btn btn-outline" id="details-cv-btn" download></a>
      </div>
      <div class="details-col">
        <h2 class="details-heading" id="details-tools-heading"></h2>
        <div class="badge-row">
          <span class="badge-row-label" id="details-platforms-label"></span>
          <div class="badge-chips" id="details-platforms"></div>
        </div>
        <div class="badge-row">
          <span class="badge-row-label" id="details-tools-label"></span>
          <div class="badge-chips" id="details-tools"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/content.js"></script>
<script src="assets/script.js"></script>
</body>
</html>
