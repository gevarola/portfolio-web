<header class="site-header" id="top">
  <div class="wrap header-inner">
    <a href="#top" class="logo">Portfolio</a>
    <nav class="main-nav" id="main-nav">
      <a href="#details" data-nav="about"></a>
      <a href="#work" data-nav="work"></a>
      <a href="#creator" data-nav="creator"></a>
      <a href="#contact" data-nav="contact"></a>
    </nav>
    <div class="header-actions">
      <div class="lang-switch" id="lang-toggle" role="group" aria-label="Language">
        <button class="lang-option" data-lang="es" type="button"><span class="lang-flag" aria-hidden="true">🇦🇷</span>ES</button>
        <button class="lang-option" data-lang="en" type="button"><span class="lang-flag" aria-hidden="true">🇺🇸</span>EN</button>
      </div>

        <span></span><span></span><span></span>

<main>
  <section class="intro section-dark">
    <div class="wrap intro-grid">
      <div class="intro-photo-wrap">
        <span class="intro-photo-panel" aria-hidden="true"></span>
        <div class="intro-photo">
          <img src="assets/images/profile.jpg" alt="Germán Rojas La Valle">
        </div>
      </div>
      <div class="intro-content">
        <p class="role-line" id="intro-status"></p>
        <h1 id="intro-title"></h1>
        <p class="intro-subtitle" id="intro-subtitle"></p>
        <div class="intro-ctas">
          <a href="#work" class="btn btn-primary" id="intro-cta-work"></a>
          <a href="#contact" class="btn btn-ghost" id="intro-cta-contact"></a>
        </div>
      </div>
    </div>
  </section>

  <div class="ticker section-light" aria-hidden="true">
    <div class="ticker-track" id="ticker-track"></div>
  </div>

  <section class="details section-light" id="details">
    <div class="wrap details-grid">
      <div class="details-col">
        <h2 class="details-heading" id="details-experience-heading"></h2>
        <ul class="timeline" id="details-experience"></ul>
      </div>
      <div class="details-col">
        <h2 class="details-heading" id="details-education-heading"></h2>
        <ul class="timeline" id="details-education"></ul>
        <div class="languages-block">
          <span class="badge-row-label" id="details-languages-label"></span>
          <p id="details-languages"></p>
        </div>
        <div class="cv-btn-row">
          <a href="assets/files/German_Rojas_La_Valle_CV_ES.pdf" class="btn btn-primary" id="details-cv-btn-es" download></a>
          <a href="assets/files/German_Rojas_La_Valle_CV_EN.pdf" class="btn btn-primary" id="details-cv-btn-en" download></a>
        </div>
      </div>
      <div class="details-col">
        <h2 class="details-heading" id="details-tools-heading"></h2>
        <div class="badge-row">
          <span class="badge-row-label" id="details-platforms-label"></span>
          <div class="badge-chips" id="details-platforms"></div>
        </div>
        <div class="badge-row">
          <span class="badge-row-label" id="details-tools-label"></span>
          <div class="badge-chips" id="details-tools"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="pillars section-dark" id="pillars">
    <div class="wrap">
      <h2 class="pillars-heading" id="pillars-eyebrow"></h2>
      <div class="index-list" id="pillars-list"></div>
    </div>
  </section>

  <section class="work section-dark" id="work">
    <div class="wrap">
      <h2 class="work-heading" id="work-heading"></h2>
      <div class="work-tabs" id="work-tabs" role="tablist"></div>
      <div class="work-panel" id="work-panel-cases">
        <div class="row-list" id="clients-list"></div>
      </div>
      <div class="work-panel" id="work-panel-brands" hidden>
        <p class="other-work-body" id="other-work-body"></p>
        <div class="row-list" id="other-work-list"></div>
      </div>
    </div>
  </section>

  <section class="creator section-dark" id="creator">
    <div class="wrap">
      <h2 class="work-heading" id="creator-eyebrow"></h2>
      <p class="creator-body" id="creator-body"></p>
      <div class="row-list" id="creator-list"></div>
    </div>
  </section>

  <section class="ai-section section-light" id="ai">
    <div class="wrap">
      <h2 class="work-heading" id="ai-eyebrow"></h2>
      <p class="ai-body" id="ai-body"></p>
      <div class="ai-tools" id="ai-tools"></div>
    </div>
  </section>

  <section class="webdev-section section-dark" id="webdev">
    <div class="wrap webdev-grid">
      <div class="webdev-content">
        <h2 class="work-heading" id="webdev-eyebrow"></h2>
        <p class="webdev-body" id="webdev-body"></p>
        <div class="webdev-stats" id="webdev-stats"></div>
        <a class="btn btn-primary" id="webdev-cta" target="_blank" rel="noopener"></a>
      </div>
      <div class="webdev-media">
        <img id="webdev-image" src="" alt="">
      </div>
    </div>
  </section>

  <section class="contact section-light" id="contact">
    <div class="wrap">
      <h2 class="work-heading" id="contact-title"></h2>
      <p class="contact-body" id="contact-body"></p>
      <div class="contact-links" id="contact-links"></div>
    </div>

<footer class="site-footer section-light">
  <div class="wrap"><p id="site-footer-text"></p></div>
</footer>

  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close"></button>

  </div>
</div>
